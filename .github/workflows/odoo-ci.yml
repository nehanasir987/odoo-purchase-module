
name: Odoo CI Pipeline

on:
  push:
  workflow_dispatch:

jobs:
  python-check:
    name: Python Syntax Check
    runs-on: ubuntu-latest

    steps:
      - name: Get Repository Code
        uses: actions/checkout@v4

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check Python Syntax
        run: python -m compileall -q .
